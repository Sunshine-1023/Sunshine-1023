<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffafb" />
      <stop offset="1" stop-color="#f7fffe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#765d68" flood-opacity="0.09" />
    </filter>
    <style>
      .eyebrow { font: 700 13px Inter, Arial, sans-serif; letter-spacing: 2px; }
      .title { font: 750 25px Inter, "PingFang SC", sans-serif; }
      .body { font: 500 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #707780; }
      .project { font: 650 14px Inter, "PingFang SC", sans-serif; }
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="450" rx="22" fill="url(#panel)" stroke="#f1c9c1" stroke-width="2" />
  <text x="48" y="55" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#a4868d">WHAT I BUILD · 我能构建什么</text>
  <text x="1150" y="55" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#aaa1a5">FROM IDEA TO WORKING PROJECT</text>

  <!-- LLM applications -->
  <g filter="url(#shadow)">
    <rect x="42" y="82" width="548" height="158" rx="18" fill="#fff8f6" stroke="#efb4a6" stroke-width="2" />
    <rect x="42" y="82" width="8" height="158" rx="4" fill="#ef6a4b" />
  </g>
  <circle cx="92" cy="126" r="22" fill="#ffe3dc" />
  <g transform="translate(80 114)" fill="none" stroke="#d85b40" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="4" width="22" height="16" rx="5" /><line x1="12" y1="4" x2="12" y2="0" /><circle cx="12" cy="0" r="1.5" fill="#d85b40" stroke="none" /><circle cx="8" cy="12" r="1.5" fill="#d85b40" stroke="none" /><circle cx="16" cy="12" r="1.5" fill="#d85b40" stroke="none" /><line x1="8" y1="17" x2="16" y2="17" />
  </g>
  <text x="128" y="116" class="eyebrow" fill="#d85b40">LLM APPLICATIONS</text>
  <text x="128" y="148" class="title" fill="#2b2e32">LLM 应用与智能工作流</text>
  <text x="78" y="184" class="body">模型调用 · Prompt 设计 · RAG · Agent 编排</text>
  <text x="78" y="215" class="project" fill="#d85b40">方向：把模型能力连接到真实任务与工具</text>

  <!-- ML / recommendation -->
  <g filter="url(#shadow)">
    <rect x="610" y="82" width="548" height="158" rx="18" fill="#faf8ff" stroke="#c8bde9" stroke-width="2" />
    <rect x="610" y="82" width="8" height="158" rx="4" fill="#7b68b4" />
  </g>
  <circle cx="660" cy="126" r="22" fill="#e9e2fb" />
  <g transform="translate(648 113)" fill="none" stroke="#705da8" stroke-width="3" stroke-linecap="round">
    <line x1="2" y1="24" x2="2" y2="15" /><line x1="12" y1="24" x2="12" y2="7" /><line x1="22" y1="24" x2="22" y2="1" />
  </g>
  <text x="696" y="116" class="eyebrow" fill="#705da8">ML &amp; RECOMMENDATION</text>
  <text x="696" y="148" class="title" fill="#2b2e32">机器学习与推荐系统</text>
  <text x="646" y="184" class="body">表格建模 · 深度学习 · 离线评估 · 序列推荐</text>
  <text x="646" y="215" class="project" fill="#705da8">实践：手机成瘾预测 · FashionRec Transformer</text>

  <!-- Full stack -->
  <g filter="url(#shadow)">
    <rect x="42" y="260" width="548" height="158" rx="18" fill="#f6fffd" stroke="#a9ded9" stroke-width="2" />
    <rect x="42" y="260" width="8" height="158" rx="4" fill="#39c5bb" />
  </g>
  <circle cx="92" cy="304" r="22" fill="#d9f6f2" />
  <g transform="translate(80 292)" fill="none" stroke="#249f97" stroke-width="2.2" stroke-linecap="round">
    <circle cx="12" cy="12" r="11" /><ellipse cx="12" cy="12" rx="5" ry="11" /><line x1="1" y1="12" x2="23" y2="12" /><path d="M3.5 6.5 H20.5 M3.5 17.5 H20.5" />
  </g>
  <text x="128" y="294" class="eyebrow" fill="#249f97">FULL-STACK DEVELOPMENT</text>
  <text x="128" y="326" class="title" fill="#2b2e32">全栈开发与数据应用</text>
  <text x="78" y="362" class="body">前后端分离 · REST API · 关系型数据库 · 业务查询</text>
  <text x="78" y="393" class="project" fill="#249f97">实践：Well Cost Management 数据管理系统</text>

  <!-- Engineering -->
  <g filter="url(#shadow)">
    <rect x="610" y="260" width="548" height="158" rx="18" fill="#fbfaff" stroke="#c9c0e9" stroke-width="2" />
    <rect x="610" y="260" width="8" height="158" rx="4" fill="#7769b5" />
  </g>
  <circle cx="660" cy="304" r="22" fill="#e8e3f8" />
  <g transform="translate(648 292)" fill="none" stroke="#6959a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4" /><path d="M12 1 V4 M12 20 V23 M1 12 H4 M20 12 H23 M4.2 4.2 L6.3 6.3 M17.7 17.7 L19.8 19.8 M19.8 4.2 L17.7 6.3 M6.3 17.7 L4.2 19.8" /><circle cx="12" cy="12" r="9" />
  </g>
  <text x="696" y="294" class="eyebrow" fill="#6959a8">ENGINEERING PRACTICE</text>
  <text x="696" y="326" class="title" fill="#2b2e32">工程实践与可复现实验</text>
  <text x="646" y="362" class="body">版本控制 · CI/CD · 自动化测试 · 配置化实验</text>
  <text x="646" y="393" class="project" fill="#6959a8">目标：让每个项目都清晰、可靠、可重复运行</text>
</svg>
