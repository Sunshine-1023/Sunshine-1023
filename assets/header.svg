<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edfdfb" />
      <stop offset="0.52" stop-color="#fff7fa" />
      <stop offset="1" stop-color="#e8f8ff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39C5BB" />
      <stop offset="0.5" stop-color="#74D7D0" />
      <stop offset="1" stop-color="#FF8FA3" />
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
