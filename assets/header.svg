<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Sunshine GitHub profile banner</title>
  <desc id="desc">A dark technology-themed banner for a machine learning and full-stack developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".52" stop-color="#102a56"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1000" height="240" rx="22" fill="url(#bg)"/>
  <circle cx="800" cy="60" r="150" fill="url(#glow)" filter="url(#blur)" opacity=".55"/>
  <circle cx="155" cy="240" r="170" fill="#7c3aed" opacity=".18" filter="url(#blur)"/>
  <g fill="none" stroke="#93c5fd" stroke-opacity=".18">
    <path d="M0 55H1000M0 120H1000M0 185H1000"/>
    <path d="M95 0V240M250 0V240M405 0V240M560 0V240M715 0V240M870 0V240"/>
  </g>
  <g transform="translate(755 42)" fill="none" stroke-linecap="round">
    <circle cx="82" cy="78" r="54" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="82" cy="78" r="28" stroke="#a78bfa" stroke-width="2"/>
    <path d="M5 79h44m66 0h44M82 1v43m0 68v43" stroke="#e0f2fe" stroke-width="3"/>
    <circle cx="82" cy="78" r="7" fill="#f8fafc" stroke="none"/>
    <circle cx="49" cy="79" r="5" fill="#38bdf8" stroke="none"/>
    <circle cx="115" cy="79" r="5" fill="#a78bfa" stroke="none"/>
  </g>
  <text x="68" y="102" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="54" font-weight="700">Hi, I'm Sunshine</text>
  <text x="70" y="148" fill="#bae6fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">Machine Learning · Recommender Systems · Full-Stack</text>
  <text x="70" y="187" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" letter-spacing="2">LEARN · BUILD · ITERATE</text>
</svg>
