    <ellipse cx="92" cy="194" rx="17" ry="6" transform="rotate(18 92 194)" />
    <ellipse cx="1092" cy="188" rx="17" ry="6" transform="rotate(-22 1092 188)" />
  </g>

  <g transform="translate(162 65)" stroke="#39C5BB" stroke-width="3" fill="#39C5BB" opacity="0.72">
