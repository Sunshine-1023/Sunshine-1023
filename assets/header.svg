    </pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#39C5BB" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1200" height="250" rx="18" fill="url(#bg)" />
  <rect width="1200" height="250" rx="18" fill="url(#dots)" />
  <rect x="20" y="20" width="1160" height="210" rx="13" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.65" />

  <g fill="#FF8FA3" opacity="0.58">
    <ellipse cx="88" cy="52" rx="20" ry="8" transform="rotate(-28 88 52)" />
